<!DOCTYPE html>
<html>
    <head>
        <title>Java script Output Methods</title>
    </head>
    <body>
        <h2>java script output Example</h2>
        <p id="special"></p>
        <script>
            // 1. document.write()
            document.write("Hello from documnent.write()<br><br>")
            // 2. innerHTMl
            document.getElementById("special").innerHTML = "<b>Hello from inerHTML</b>";
            // 3. window.alert()
            window.alert("Hello from window.alert()");
            
        </script>
    </body>
</html>
